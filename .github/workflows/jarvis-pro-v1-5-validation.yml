name: JARVIS v3.33 and legacy offline validation
on:
  pull_request:
    paths:
      - 'research/jarvis/jarvis_pro_v1_5_gate.py'
      - 'research/jarvis/test_jarvis_pro_v1_5_gate.py'
      - 'research/jarvis/v333/**'
      - '.github/workflows/jarvis-pro-v1-5-validation.yml'
  workflow_dispatch:
jobs:
  synthetic_tests:
    name: Legacy and v3.33 synthetic tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run legacy v1.5 tests
        run: python -m unittest discover -s research/jarvis -p 'test_jarvis_pro_v1_5_gate.py' -v
      - name: Run v3.33 offline research tests
        run: python -m unittest discover -s research/jarvis/v333 -p 'test_jarvis_v333.py' -v
