name: JARVIS PRO v1.5 offline validation
on:
  pull_request:
    paths:
      - 'research/jarvis/jarvis_pro_v1_5_gate.py'
      - 'research/jarvis/test_jarvis_pro_v1_5_gate.py'
      - '.github/workflows/jarvis-pro-v1-5-validation.yml'
  workflow_dispatch:
jobs:
  synthetic_tests:
    name: Synthetic control tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run pure offline tests
        run: python -m unittest discover -s research/jarvis -p 'test_jarvis_pro_v1_5_gate.py' -v
